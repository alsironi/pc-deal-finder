<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Deal Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1>Deal Finder</h1>
    <p class="tagline">Ofertas de juegos PC · CheapShark</p>
  </header>

  <section class="search-panel">
    <input id="searchInput" type="search" placeholder="Buscar juego (ej: Cyberpunk)" autocomplete="off" />
    <button id="searchBtn" type="button">Buscar</button>
    <button id="topDealsBtn" type="button" class="secondary">Ver Chollos Top</button>
  </section>

  <p id="status" class="status" aria-live="polite"></p>
  <main id="results" class="results"></main>

  <script src="renderer.js"></script>
</body>
</html>
